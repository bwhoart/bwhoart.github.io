<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ScrptLab Games</title>
<style>
  :root { --bg:#fafaf7; --fg:#1d1d1f; --muted:#6e6e73; --accent:#e4572e; --card:#fff; --line:#e5e5ea; }
  @media (prefers-color-scheme: dark) { :root { --bg:#111; --fg:#f2f2f2; --muted:#a1a1a6; --card:#1c1c1e; --line:#2c2c2e; } }
  * { box-sizing:border-box; }
  body { margin:0; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; background:var(--bg); color:var(--fg); line-height:1.6; }
  main { max-width:720px; margin:0 auto; padding:48px 16px; }
  h1 { font-size:2rem; margin:0 0 4px; }
  .sub { color:var(--muted); margin:0 0 32px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:16px; padding:20px; margin-bottom:16px; }
  .card h2 { margin:0 0 6px; font-size:1.2rem; }
  .card p { margin:0 0 12px; color:var(--muted); }
  a { color:var(--accent); }
  footer { margin-top:40px; color:var(--muted); font-size:.9rem; }
</style>
</head>
<body>
<main>
  <h1>ScrptLab Games</h1>
  <p class="sub">Bağımsız oyun geliştirici · Independent game developer</p>

  <div class="card">
    <h2>Minik Orkestra</h2>
    <p>Çocuklar için müzik oyunu. · A music game for kids.</p>
    <a href="minik-orkestra-privacy.html">Gizlilik Politikası / Privacy Policy</a>
  </div>

  <footer>
    İletişim / Contact: <a href="mailto:bkrurnofs@gmail.com">bkrurnofs@gmail.com</a>
  </footer>
</main>
</body>
</html>
